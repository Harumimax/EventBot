[project]
name = "eventbot"
version = "0.1.0"
description = "Telegram bot for collecting participants for group events."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eventbot*"]
